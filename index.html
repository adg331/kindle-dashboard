<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="refresh" content="600">
  <title>Codex Quota</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="clock">
      <strong id="clock-time">--:--</strong>
      <span id="clock-date">--月--日</span>
    </header>
    <div class="brand"><h1>CODEX</h1><span id="plan">--</span></div>
    <section class="quota">
      <div class="label"><strong>5 小时额度</strong><span>剩余 <b id="five-percent">--%</b></span></div>
      <div class="bar"><i id="five-bar"></i></div>
      <p id="five-reset">--</p>
    </section>
    <section class="quota">
      <div class="label"><strong>每周额度</strong><span>剩余 <b id="week-percent">--%</b></span></div>
      <div class="bar"><i id="week-bar"></i></div>
      <p id="week-reset">--</p>
    </section>
    <footer><b id="health-mark">●</b> <span id="health">等待数据</span> · <span id="updated">--</span></footer>
    <p id="error" class="error"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
